services:
  mysql:
    image: mysql:8.4
    container_name: cylinder-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: cylinder_db
    ports:
      - "3307:3306"
    volumes:
      - cylinder_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ppassword"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: cylinder-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql+pymysql://root:password@mysql:3306/cylinder_db
      SECRET_KEY: chroma-print-secret-key-change-me
      ALLOWED_ORIGINS: http://localhost
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: cylinder-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  cylinder_mysql_data:
